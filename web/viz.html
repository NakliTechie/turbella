<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turbella · visualiser</title>
<style>
  /* The picture is the content, so this page is dark; the controls stay small. */
  /* Dense direction: one cool ink ladder; the picture carries the colour. */
  :root { --ink: #f2f4f7; --muted: rgba(242, 244, 247, 0.7); --line: rgba(242, 244, 247, 0.4);
    --faint: rgba(242, 244, 247, 0.2); --panel: rgba(14, 16, 20, 0.58);
    --accent: #2563eb; --warn: #d97706; --bad: #dc2626; }
  html, body { margin: 0; height: 100%; background: #000; color: var(--ink);
    font-family: system-ui, -apple-system, sans-serif; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .hud { position: fixed; top: 14px; left: 16px; display: flex; gap: 12px; align-items: center;
    padding: 8px 12px; border-radius: 8px; background: var(--panel); backdrop-filter: blur(6px);
    font-size: 13px; transition: opacity 0.6s; }
  .hud.quiet { opacity: 0.15; }
  .hud:hover { opacity: 1; }
  a { color: var(--ink); font-weight: 600; text-decoration: none; }
  a:hover { text-decoration: underline; }
  .help { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 11px;
    border: 1px solid var(--line); font-size: 12px; text-decoration: none; }
  .help:hover { border-color: var(--ink); text-decoration: none; }
  button { background: transparent; border: 1px solid var(--line); color: var(--ink);
    padding: 4px 10px; border-radius: 6px; font: inherit; font-size: 12px; cursor: pointer; }
  button:hover { border-color: var(--ink); }
  button[aria-pressed="true"] { background: var(--faint); border-color: var(--ink); }
  /* In the floating window (?overlay=1) the bar is compact: controls and gauge, no preset name. */
  body.overlay .hud { top: 8px; left: 8px; right: 8px; padding: 4px 8px; gap: 6px; font-size: 11px; flex-wrap: wrap; }
  body.overlay .hud > a, body.overlay #preset { display: none; }
  body.overlay button { padding: 2px 7px; font-size: 11px; }
  body.overlay .hud.quiet { opacity: 0.3; }
  /* Hide bar: gone until the pointer is over the window. `pointer` is set by
     the floating window, which sees the pointer even when the page does not. */
  body.bar-hidden .hud, body.bar-hidden .hud.quiet { opacity: 0; }
  body.pointer .hud.hud, body.bar-hidden .hud.hud:hover, body.overlay .hud.hud:hover { opacity: 1; }
  /* Just hidden with the pointer still inside: stay hidden until it leaves. */
  body.bar-hidden.bar-held .hud.hud { opacity: 0; }
  button.icon { display: inline-flex; align-items: center; justify-content: center; min-width: 28px; height: 22px; padding: 0 7px; }
  button.icon svg { display: block; }
  body.overlay button.icon { min-width: 24px; height: 19px; padding: 0 5px; }
  /* The readout: the gauge, then one line per session (all sessions) or the
     status line (one session). It never fades, because the gauge is the stuck signal. */
  #readout { position: fixed; left: 16px; bottom: 14px; max-width: calc(100% - 32px); max-height: calc(100% - 70px);
    overflow: hidden; padding: 6px 10px; border-radius: 8px; background: var(--panel); backdrop-filter: blur(6px);
    font: 13px/1.5 ui-monospace, monospace; color: var(--muted); }
  body.overlay #readout { left: 8px; bottom: 8px; max-width: calc(100% - 16px); max-height: calc(100% - 44px);
    padding: 4px 8px; border-radius: 6px; font-size: 11px; }
  #gauge { display: flex; align-items: center; gap: 8px; }
  #sessions div, #last { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #sessions b { color: var(--ink); font-weight: 600; margin-right: 0.4em; }
  .state-bad { color: var(--bad); } .state-warn { color: var(--warn); }
  body.overlay #gaugeBar { width: 60px; }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  /* The preset's title is third-party text, so it is not shown; agents still get it from next_look. */
  #preset { display: none; }
  #gaugeBar { width: 120px; height: 6px; border-radius: 3px; background: var(--faint); overflow: hidden; }
  #gaugeFill { height: 100%; width: 0; background: var(--accent); transition: width 0.3s, background 0.3s; }
  #gaugeValue { font-variant-numeric: tabular-nums; min-width: 2.5em; }

</style>
<canvas id="canvas"></canvas>
<div class="hud" id="hud">
  <a href="/" title="Back to the timeline">Turbella</a>
  <span id="preset">loading…</span>
  <a class="help" href="/guide/" title="Guide" aria-label="Guide">?</a>
  <button id="btnNext" class="icon" data-tool="next_look" aria-label="Next look" title="Next look"><svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path d="M3 2.5l7.5 5.5L3 13.5z" fill="currentColor"/><path d="M12.5 2.5v11" stroke="currentColor" stroke-width="1.8"/></svg></button>
  <button id="btnCycle" class="icon" data-tool="cycle_looks" aria-pressed="false" aria-label="Cycle looks" title="Cycle looks every 30 s"><svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2.5 7.5A5.5 5.5 0 0 1 12.4 4.2"/><path d="M12.8 1.2v3.2H9.6"/><path d="M13.5 8.5A5.5 5.5 0 0 1 3.6 11.8"/><path d="M3.2 14.8v-3.2h3.2"/></svg></button>
  <button id="btnBar" class="icon" data-tool="set_toolbar" aria-pressed="false" aria-label="Hide bar" title="Hide this bar until the pointer comes back"><svg viewBox="0 0 24 16" width="16" height="11" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M1 8c3-4.5 6.7-7 11-7s8 2.5 11 7c-3 4.5-6.7 7-11 7S4 12.5 1 8z"/><circle cx="12" cy="8" r="3"/></svg></button>
</div>
<div id="readout">
  <div id="gauge" title="turbulence: 0 calm, 1 stuck"><span id="gaugeLabel">turb</span><div id="gaugeBar"><div id="gaugeFill"></div></div><span id="gaugeValue">0.00</span></div>
  <div id="sessions" aria-live="off"></div>
  <div id="last">waiting for the agent…</div>
</div>

<script src="/vendor/butterchurn.min.js"></script>
<script src="/vendor/butterchurnPresets.min.js"></script>
<script type="module">
  // No WebGL 2, no visualiser: go to the timeline and say why.
  if (document.createElement('canvas').getContext('webgl2')) import('../src/viz.js');
  else location.replace('/?from=viz');
</script>
</html>
