<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turbella</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0b0f19; color: #e2e8f0;
    font-family: system-ui, -apple-system, sans-serif; overflow: hidden; }
  body { display: grid; grid-template-rows: auto 1fr auto; }
  header { padding: 10px 14px; border-bottom: 1px solid #1e293b;
    background: #0f172a; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  h1 { font-size: 14px; margin: 0; letter-spacing: 0.05em; text-transform: uppercase;
    opacity: 0.7; }
  button { background: #1e293b; border: 1px solid #334155; color: #e2e8f0;
    padding: 6px 12px; border-radius: 6px; font: inherit; cursor: pointer; }
  button:hover { border-color: #64748b; }
  button.active { background: #2563eb; border-color: #2563eb; }
  input[type=range] { accent-color: #2563eb; width: 140px; }
  label { font-size: 12px; opacity: 0.8; margin-right: 6px; }
  select, input[type=file] { font: inherit; font-size: 12px; padding: 4px;
    background: #1e293b; border: 1px solid #334155; color: #e2e8f0; border-radius: 4px; }
  #status { font-size: 12px; opacity: 0.6; margin-left: 10px; }
  main { position: relative; display: grid; grid-template-rows: 1fr auto; }
  #wrap { position: relative; background: #050a14; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }
  footer { padding: 8px 14px; border-top: 1px solid #1e293b; background: #0f172a;
    display: flex; gap: 14px; align-items: center; font-size: 12px; opacity: 0.7; }
  .hint { font-size: 11px; opacity: 0.5; }
  .overlay { position: absolute; top: 10px; left: 10px; pointer-events: none; }
</style>
</head>
<body>
<header>
  <h1>Turbella</h1>
  <button id="btnPlay" data-tool="play pause">▶ Play</button>
  <button id="btnLive" data-tool="go_live">● Live</button>
  <label>speed</label>
  <select id="selSpeed" data-tool="set_speed">
    <option value="0.25">¼×</option>
    <option value="1" selected>1×</option>
    <option value="2">2×</option>
    <option value="5">5×</option>
    <option value="10">10×</option>
  </select>
  <label>scrub</label>
  <input id="scrub" data-tool="seek" type="range" min="0" max="100" value="0">
  <label>load</label>
  <input id="fileInput" data-tool="load_events" type="file" accept=".json,.jsonl,.txt">
  <div id="status">idle</div>
</header>
<main>
  <div id="wrap">
    <canvas id="canvas"></canvas>
    <div class="overlay">
      <div id="overlayTime" style="font:12px monospace; background:rgba(0,0,0,0.5);
        padding:2px 6px; border-radius:4px; display:inline-block;">— / —</div>
    </div>
  </div>
</main>
<footer>
  <span class="hint">red spike = failed tool · amber = permission wait · violet pulse = thinking · loop glyph = stuck on repeat</span>
</footer>

<script type="module">
  // One core, two doors: every control below calls a handler in TOOLS, and the
  // same handlers are published to agents (navigator.modelContext where the
  // browser has it, window.turbella.tools otherwise). Names come from
  // src/manifest.js; scripts/verify.mjs checks the page against it.
  import { createPlayer } from '../src/playback.js';
  import { createRenderer } from '../src/render.js';
  import { readClaudeEvents } from '../src/transcript.js';
  import { toolsFor } from '../src/manifest.js';

  const $ = (id) => document.getElementById(id);
  const canvas = $('canvas');
  const btnPlay = $('btnPlay');
  const btnLive = $('btnLive');
  const selSpeed = $('selSpeed');
  const scrub = $('scrub');
  const fileInput = $('fileInput');
  const status = $('status');
  const overlayTime = $('overlayTime');

  const renderer = createRenderer(canvas);
  window.addEventListener('resize', () => { renderer.resize(); draw(); });
  renderer.resize();

  // ---- embedded example (shown until real events load or arrive) ------------

  const EXAMPLE = [
    { ts: 1000, agent: 'claude', session: 's-retry', kind: 'think', status: 'ok', tool: null, dur_ms: 1200, sig: 'sha256:think1' },
    { ts: 1500, agent: 'claude', session: 's-retry', kind: 'tool', status: 'ok', tool: 'Bash', dur_ms: 1500, sig: 'sha256:git-push' },
    { ts: 3000, agent: 'claude', session: 's-retry', kind: 'tool_fail', status: 'error', tool: 'Bash', dur_ms: 1500, sig: 'sha256:fail-git-push' },
    { ts: 4000, agent: 'claude', session: 's-retry', kind: 'tool', status: 'ok', tool: 'Bash', dur_ms: 1500, sig: 'sha256:git-push' },
    { ts: 5500, agent: 'claude', session: 's-retry', kind: 'tool_fail', status: 'error', tool: 'Bash', dur_ms: 1500, sig: 'sha256:fail-git-push' },
    { ts: 7000, agent: 'claude', session: 's-retry', kind: 'tool', status: 'ok', tool: 'Write', dur_ms: 200, sig: 'sha256:write-notes' },
  ];

  // ---- state ------------------------------------------------------------------

  let player = createPlayer([]);
  let allEvents = [];
  let raf = null;
  let live = null; // EventSource while following the daemon

  const t0 = () => allEvents[0]?.ts ?? 0;
  const span = () => (allEvents[allEvents.length - 1]?.ts ?? t0()) - t0();

  function formatMs(ms) {
    const s = Math.max(0, Math.round(ms / 1000));
    const m = Math.floor(s / 60);
    const r = s % 60;
    return m ? `${m}:${String(r).padStart(2, '0')}` : `${r}s`;
  }

  function draw(snap = player.snapshot()) {
    renderer.feed(snap, allEvents);
    renderer.draw();
    scrub.value = Math.round((snap.progress || 0) * 100);
    overlayTime.textContent = formatMs(snap.time - t0()) + ' / ' + formatMs(span());
    btnPlay.textContent = player.playing ? '⏸ Pause' : '▶ Play';
    btnLive.classList.toggle('active', !!live);
  }

  function loop() {
    const s = player.tick(performance.now());
    draw(s);
    if (s.playing && s.arrived < s.total) raf = requestAnimationFrame(loop);
    else { raf = null; if (s.playing) player.pause(); draw(); }
  }

  function stopLive() {
    if (live) { live.close(); live = null; }
  }

  function show(events, label) {
    if (raf) cancelAnimationFrame(raf);
    raf = null;
    allEvents = events;
    player = createPlayer(events, { startTime: t0(), speed: Number(selSpeed.value) });
    player.pause();
    status.textContent = label ?? `${events.length} events · ${new Set(events.map((e) => e.agent)).size} agents`;
    draw();
  }

  // Neutral event array, or Claude Code JSONL text parsed by the shared reader
  // (hashes only, same as the CLI).
  async function toEvents(input) {
    if (Array.isArray(input)) return input;
    const text = String(input);
    const lines = text.split(/\r?\n/);
    const first = lines.find((l) => l.trim());
    try { if (first && JSON.parse(first).kind) return lines.filter((l) => l.trim()).map((l) => JSON.parse(l)); } catch {}
    const events = [];
    for await (const ev of readClaudeEvents(lines)) events.push(ev);
    return events;
  }

  // ---- tools: the one core every control and every agent call goes through ----

  const TOOLS = {
    play() {
      if (!allEvents.length) return { playing: false };
      if (player.progress >= 1) player.seek(t0());
      player.play();
      if (!raf) loop();
      return { playing: true };
    },
    pause() {
      player.pause();
      draw();
      return { playing: false };
    },
    set_speed({ speed }) {
      const was = player.playing;
      player.setSpeed(Number(speed));
      if (!was) player.pause();
      selSpeed.value = String(speed);
      return { speed: player.speed };
    },
    seek({ fraction }) {
      const f = Math.min(Math.max(Number(fraction) || 0, 0), 1);
      player.seek(t0() + f * span());
      draw();
      return { time: player.time };
    },
    async load_events({ events }) {
      stopLive();
      const evs = await toEvents(events);
      show(evs);
      return { events: evs.length };
    },
    go_live() {
      if (live) return { live: true };
      if (!/^https?:$/.test(location.protocol)) throw new Error('live needs the page served by the daemon (turbella open)');
      show([], 'live · waiting for events…');
      live = new EventSource('/events');
      live.onmessage = (e) => {
        let ev;
        try { ev = JSON.parse(e.data); } catch { return; }
        allEvents.push(ev);
        player.append([ev]);
        player.seek(ev.ts); // follow the newest event
        status.textContent = `${allEvents.length} events · live`;
        draw();
      };
      live.onerror = () => { status.textContent = 'live · reconnecting…'; };
      draw();
      return { live: true };
    },
  };

  // Publish the agent face from the manifest; refuse to load if a tool lacks a handler.
  const PAGE_TOOLS = toolsFor('page');
  for (const t of PAGE_TOOLS) {
    if (!TOOLS[t.name]) throw new Error(`manifest tool "${t.name}" has no page handler`);
  }
  window.turbella = { tools: Object.fromEntries(PAGE_TOOLS.map((t) => [t.name, (args = {}) => TOOLS[t.name](args)])) };
  if (navigator.modelContext?.registerTool) {
    for (const t of PAGE_TOOLS) {
      navigator.modelContext.registerTool({
        name: t.name, description: t.description, inputSchema: t.inputSchema,
        execute: async (args) => ({ content: [{ type: 'text', text: JSON.stringify(await TOOLS[t.name](args ?? {})) }] }),
      });
    }
  }

  // ---- the human door: controls call the same tools -------------------------

  btnPlay.addEventListener('click', () => (player.playing ? TOOLS.pause() : TOOLS.play()));
  btnLive.addEventListener('click', () => { try { TOOLS.go_live(); } catch (e) { status.textContent = e.message; } });
  selSpeed.addEventListener('change', () => TOOLS.set_speed({ speed: Number(selSpeed.value) }));
  scrub.addEventListener('input', () => TOOLS.seek({ fraction: Number(scrub.value) / 100 }));
  fileInput.addEventListener('change', () => {
    const f = fileInput.files[0];
    if (!f) return;
    status.textContent = 'reading ' + f.name + '…';
    f.text()
      .then((text) => TOOLS.load_events({ events: text }))
      .then(() => { status.textContent = 'loaded ' + f.name; })
      .catch(() => { status.textContent = 'read failed'; });
  });

  // Served by the daemon: follow it live. Opened as a file: show the example.
  if (/^https?:$/.test(location.protocol)) TOOLS.go_live();
  else show(EXAMPLE, 'example session · load a transcript to replay it');
</script>
</body>
</html>
