<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turbella</title>
<style>
  /* Light by default and not tied to the system theme (house rule for app UIs). */
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --canvas: #ffffff; --line: #e5e5e2;
    --ink: #1c1c1a; --muted: #6b6b66; --accent: #2563eb; --warn: #d97706; --bad: #dc2626;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, sans-serif; overflow: hidden; }
  body { display: grid; grid-template-rows: auto 1fr auto; }
  header { padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel);
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  h1 { font-size: 14px; margin: 0 6px 0 0; letter-spacing: 0.04em; font-weight: 600; }
  button { background: var(--panel); border: 1px solid var(--line); color: var(--ink);
    padding: 6px 12px; border-radius: 6px; font: inherit; font-size: 13px; cursor: pointer; }
  button:hover { border-color: var(--muted); }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  input[type=range] { accent-color: var(--accent); width: 140px; }
  label { font-size: 12px; color: var(--muted); }
  select, input[type=file] { font: inherit; font-size: 12px; padding: 4px;
    background: var(--panel); border: 1px solid var(--line); color: var(--ink); border-radius: 4px; }
  #status { font-size: 12px; color: var(--muted); }
  #gauge { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
  #gaugeBar { width: 120px; height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
  #gaugeFill { height: 100%; width: 0; background: var(--accent); transition: width 0.3s, background 0.3s; }
  #gaugeValue { font-variant-numeric: tabular-nums; color: var(--ink); min-width: 2.5em; }
  main { position: relative; min-height: 0; }
  #wrap { position: absolute; inset: 0; background: var(--canvas); overflow: hidden; }
  canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
  footer { padding: 8px 16px; border-top: 1px solid var(--line); background: var(--panel);
    font-size: 12px; color: var(--muted); }
  .overlay { position: absolute; bottom: 10px; left: 16px; pointer-events: none; }
  #overlayTime { font: 12px ui-monospace, monospace; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Turbella</h1>
  <button id="btnPlay" data-tool="play pause">▶ Play</button>
  <button id="btnLive" data-tool="go_live">● Live</button>
  <label>speed</label>
  <select id="selSpeed" data-tool="set_speed">
    <option value="0.25">¼×</option>
    <option value="1" selected>1×</option>
    <option value="2">2×</option>
    <option value="5">5×</option>
    <option value="10">10×</option>
  </select>
  <label>scrub</label>
  <input id="scrub" data-tool="seek" type="range" min="0" max="100" value="0">
  <label>load</label>
  <input id="fileInput" data-tool="load_events" type="file" accept=".json,.jsonl,.txt">
  <div id="status">idle</div>
  <div id="gauge" title="Turbulence: repeated failures, edit thrash, tool switching and time since progress, 0 to 1">
    turbulence <div id="gaugeBar"><div id="gaugeFill"></div></div> <span id="gaugeValue">0.00</span>
  </div>
</header>
<main>
  <div id="wrap">
    <canvas id="canvas"></canvas>
    <div class="overlay">
      <div id="overlayTime">— / —</div>
    </div>
  </div>
</main>
<footer>
  <span>red spike = failed tool · amber = permission wait · violet dot = thinking (bigger = longer) · loop glyph = stuck on repeat</span>
</footer>

<script type="module">
  // One core, two doors: every control below calls a handler in TOOLS, and the
  // same handlers are published to agents (navigator.modelContext where the
  // browser has it, window.turbella.tools otherwise). Names come from
  // src/manifest.js; scripts/verify.mjs checks the page against it.
  import { createPlayer } from '../src/playback.js';
  import { createRenderer } from '../src/render.js';
  import { readClaudeEvents } from '../src/transcript.js';
  import { toolsFor } from '../src/manifest.js';
  import { gaugeSnapshot } from '../src/gauge.js';

  const $ = (id) => document.getElementById(id);
  const canvas = $('canvas');
  const btnPlay = $('btnPlay');
  const btnLive = $('btnLive');
  const selSpeed = $('selSpeed');
  const scrub = $('scrub');
  const fileInput = $('fileInput');
  const status = $('status');
  const overlayTime = $('overlayTime');
  const gaugeFill = $('gaugeFill');
  const gaugeValue = $('gaugeValue');

  const renderer = createRenderer(canvas);
  window.addEventListener('resize', () => { renderer.resize(); draw(); });
  renderer.resize();

  // ---- state ------------------------------------------------------------------

  let player = createPlayer([]);
  let allEvents = [];
  let raf = null;
  let live = null;     // EventSource while connected to the daemon
  let follow = false;  // the playhead tracks the newest live event
  const SPEEDS = toolsFor('page').find((t) => t.name === 'set_speed').inputSchema.properties.speed.enum;
  const following = () => !!live && follow;

  const t0 = () => allEvents[0]?.ts ?? 0;
  const span = () => (allEvents[allEvents.length - 1]?.ts ?? t0()) - t0();

  function formatMs(ms) {
    const s = Math.max(0, Math.round(ms / 1000));
    const m = Math.floor(s / 60);
    const r = s % 60;
    return m ? `${m}:${String(r).padStart(2, '0')}` : `${r}s`;
  }

  function draw(snap = player.snapshot()) {
    renderer.feed(snap, allEvents);
    renderer.draw();
    scrub.value = Math.round((snap.progress || 0) * 100);
    overlayTime.textContent = formatMs(snap.time - t0()) + ' / ' + formatMs(span());
    btnPlay.textContent = player.playing ? '⏸ Pause' : '▶ Play';
    btnLive.classList.toggle('active', following());
    // Following live: measured against the wall clock, so a silent wait raises it.
    const g = snap.eventsSoFar.length ? gaugeSnapshot(snap.eventsSoFar, { now: following() ? Date.now() : snap.time }) : 0;
    gaugeValue.textContent = g.toFixed(2);
    gaugeFill.style.width = `${Math.round(g * 100)}%`;
    gaugeFill.style.background = g >= 0.5 ? 'var(--bad)' : g >= 0.25 ? 'var(--warn)' : 'var(--accent)';
  }
  // Redraw once a second while live, so the gauge moves during a silent wait.
  setInterval(() => { if (following()) draw(); }, 1000);

  function loop() {
    const s = player.tick(performance.now());
    draw(s);
    if (s.playing && s.arrived < s.total) raf = requestAnimationFrame(loop);
    else { raf = null; if (s.playing) player.pause(); draw(); }
  }

  function stopLive() {
    if (live) { live.close(); live = null; }
    follow = false;
  }

  function show(events, label) {
    if (raf) cancelAnimationFrame(raf);
    raf = null;
    allEvents = events;
    player = createPlayer(events, { startTime: t0(), speed: Number(selSpeed.value) });
    player.pause();
    status.textContent = label ?? `${events.length} events · ${new Set(events.map((e) => e.agent)).size} agents`;
    draw();
  }

  // Neutral event array, or Claude Code JSONL text parsed by the shared reader
  // (hashes only, same as the CLI).
  async function toEvents(input) {
    if (Array.isArray(input)) return input;
    const text = String(input);
    try { const all = JSON.parse(text); if (Array.isArray(all)) return all; } catch {}
    const lines = text.split(/\r?\n/);
    const first = lines.find((l) => l.trim());
    try { if (first && JSON.parse(first).kind) return lines.filter((l) => l.trim()).map((l) => JSON.parse(l)); } catch {}
    const events = [];
    for await (const ev of readClaudeEvents(lines)) events.push(ev);
    return events;
  }

  // ---- tools: the one core every control and every agent call goes through ----

  const TOOLS = {
    play() {
      if (!allEvents.length) return { playing: false };
      follow = false;
      if (player.progress >= 1) player.seek(t0());
      player.play();
      if (!raf) loop();
      return { playing: true };
    },
    pause() {
      follow = false;
      player.pause();
      draw();
      return { playing: false };
    },
    set_speed({ speed }) {
      const v = Number(speed);
      if (!SPEEDS.includes(v)) throw new Error(`speed must be one of ${SPEEDS.join(', ')}`);
      player.setSpeed(v);
      selSpeed.value = String(v);
      return { speed: player.speed };
    },
    seek({ fraction }) {
      follow = false;
      const f = Math.min(Math.max(Number(fraction) || 0, 0), 1);
      player.seek(t0() + f * span());
      draw();
      return { time: player.time };
    },
    async load_events({ events }) {
      stopLive();
      const evs = await toEvents(events);
      show(evs);
      return { events: evs.length };
    },
    go_live() {
      if (live) {
        follow = true;
        if (allEvents.length) player.seek(allEvents[allEvents.length - 1].ts);
        draw();
        return { live: true };
      }
      follow = true;
      show([], 'live · waiting for events…');
      live = new EventSource('/events');
      live.onmessage = (e) => {
        let ev;
        try { ev = JSON.parse(e.data); } catch { return; }
        allEvents.push(ev);
        player.append([ev]);
        if (follow) player.seek(ev.ts);
        status.textContent = `${allEvents.length} events · live`;
        draw();
      };
      live.onerror = () => { status.textContent = 'live · reconnecting…'; };
      draw();
      return { live: true };
    },
  };

  // Publish the agent face from the manifest; refuse to load if a tool lacks a handler.
  const PAGE_TOOLS = toolsFor('page');
  for (const t of PAGE_TOOLS) {
    if (!TOOLS[t.name]) throw new Error(`manifest tool "${t.name}" has no page handler`);
  }
  window.turbella = { tools: Object.fromEntries(PAGE_TOOLS.map((t) => [t.name, (args = {}) => TOOLS[t.name](args)])) };
  if (navigator.modelContext?.registerTool) {
    for (const t of PAGE_TOOLS) {
      navigator.modelContext.registerTool({
        name: t.name, description: t.description, inputSchema: t.inputSchema,
        execute: async (args) => ({ content: [{ type: 'text', text: JSON.stringify(await TOOLS[t.name](args ?? {})) }] }),
      });
    }
  }

  // ---- the human door: controls call the same tools -------------------------

  btnPlay.addEventListener('click', () => (player.playing ? TOOLS.pause() : TOOLS.play()));
  btnLive.addEventListener('click', () => TOOLS.go_live());
  selSpeed.addEventListener('change', () => TOOLS.set_speed({ speed: Number(selSpeed.value) }));
  scrub.addEventListener('input', () => TOOLS.seek({ fraction: Number(scrub.value) / 100 }));
  fileInput.addEventListener('change', () => {
    const f = fileInput.files[0];
    if (!f) return;
    status.textContent = 'reading ' + f.name + '…';
    f.text()
      .then((text) => TOOLS.load_events({ events: text }))
      .then(() => { status.textContent = 'loaded ' + f.name; })
      .catch(() => { status.textContent = 'read failed'; });
  });

  // The page is served by the daemon, so it starts by following it live.
  TOOLS.go_live();
</script>
</body>
</html>
